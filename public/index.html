<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat en tiempo real</title>
<style>
:root{--bg:#0f1318;--card:#181e26;--tx:#e8ecf1;--mu:#94a0ad;--bd:#2a333e;--ac:#6b96ff;--me:#22345e;--ok:#4cc27a;--er:#ff7b80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.st{font-size:13px;color:var(--mu)}.st.on{color:var(--ok)}.st.er{color:var(--er)}
.notice{background:var(--me);border:1px solid var(--ac);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:2fr 1fr}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
#msgs{height:min(50vh,420px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.m{max-width:85%;padding:8px 11px;border-radius:10px;border:1px solid var(--bd);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me);border-color:transparent}
.m .h{font-size:12px;color:var(--mu);margin-bottom:2px}
.sys{align-self:center;font-size:12px;color:var(--mu)}
.row{display:flex;gap:8px}
input[type=text]{font:inherit;padding:8px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0;flex:1;width:100%}
button{font:inherit;padding:8px 14px;border-radius:7px;border:0;background:var(--ac);color:#fff;cursor:pointer}
ul{list-style:none;margin:0;padding:0}li{padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}li:last-child{border:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.note{font-size:12px;color:var(--mu);margin-top:6px}
#adminList li{font:12px ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<main>
<div class="top"><h1>💬 Chat en tiempo real</h1><span class="st" id="st">Conectando…</span></div>
<div class="notice">🛈 Este chat registra la IP de cada participante al conectarse. Es visible solo para quien tenga la clave de administrador.</div>
<div class="grid">
<div class="card">
<div id="msgs"></div>
<div class="row"><input type="text" id="txt" maxlength="500" placeholder="Escribe un mensaje…" autocomplete="off"><button id="go">Enviar</button></div>
</div>
<div>
<div class="card"><h2>Tu identidad</h2><input type="text" id="nick" maxlength="24" placeholder="Tu nombre"></div>
<div class="card" style="margin-top:12px"><h2>Conectados (<span id="cnt">0</span>)</h2><ul id="peers"></ul></div>
<div class="card" style="margin-top:12px"><h2>🔑 Acceso de administrador</h2>
<div class="row"><input type="text" id="adminPass" placeholder="Clave"><button id="adminGo">Entrar</button></div>
<div class="note" id="adminMsg"></div>
</div>
<div class="card" id="adminCard" style="margin-top:12px;display:none"><h2>Panel de administrador</h2>
<ul id="adminList"><li class="mu">Sin datos aún</li></ul></div>
</div>
</div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const color=s=>`hsl(${[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)%360} 65% 50%)`;
let nick=localStorage.getItem('chat-nick')||('Anónimo'+Math.floor(100+Math.random()*900));
$('nick').value=nick;
const adminSeen={};let isAdmin=false;

function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;$('msgs').append(d);$('msgs').scrollTop=1e9}
function addMsg(m,mine){
  const d=document.createElement('div');d.className='m'+(mine?' me':'');
  const h=document.createElement('div');h.className='h';
  const dot=document.createElement('span');dot.className='dot';dot.style.background=color(m.id);
  h.append(dot,`${mine?'Tú':m.nick} · ${new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`);
  const t=document.createElement('div');t.textContent=m.text;
  d.append(h,t);$('msgs').append(d);$('msgs').scrollTop=1e9;
}
function drawPeers(list){
  const ul=$('peers');ul.textContent='';$('cnt').textContent=list.length;
  list.forEach(p=>{const li=document.createElement('li'),dot=document.createElement('span');dot.className='dot';dot.style.background=color(p.id);li.append(dot,p.nick);ul.append(li)});
}
function drawAdmin(){
  const ul=$('adminList'),ids=Object.keys(adminSeen);ul.textContent='';
  if(!ids.length){ul.innerHTML='<li class="mu">Sin datos aún</li>';return}
  ids.forEach(id=>{const e=adminSeen[id],li=document.createElement('li');li.textContent=`${e.nick} — IP ${e.ip} (${id.slice(0,6)})`;ul.append(li)});
}

const socket=io();
socket.on('connect',()=>{$('st').textContent='● En línea';$('st').className='st on';socket.emit('presence',{nick})});
socket.on('disconnect',()=>{$('st').textContent='Reconectando…';$('st').className='st er'});
socket.on('chat',m=>addMsg(m,m.id===socket.id));
socket.on('roster',drawPeers);
socket.on('admin_ok',list=>{
  isAdmin=true;$('adminMsg').textContent='';$('adminCard').style.display='';
  list.forEach(p=>adminSeen[p.id]={nick:p.nick,ip:p.ip});drawAdmin();
});
socket.on('admin_fail',()=>{$('adminMsg').textContent='Clave incorrecta.';$('adminMsg').style.color='var(--er)'});
socket.on('admin_update',p=>{if(isAdmin){adminSeen[p.id]={nick:p.nick,ip:p.ip};drawAdmin()}});
socket.on('admin_left',id=>{if(isAdmin){delete adminSeen[id];drawAdmin()}});

$('go').onclick=()=>{const text=$('txt').value.trim();if(!text)return;$('txt').value='';socket.emit('chat',{text})};
$('txt').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('nick').onchange=()=>{nick=$('nick').value.trim()||nick;localStorage.setItem('chat-nick',nick);socket.emit('presence',{nick})};
$('adminGo').onclick=()=>socket.emit('admin_login',$('adminPass').value);
$('adminPass').onkeydown=e=>{if(e.key==='Enter')$('adminGo').click()};
</script>
</body>
</html>
